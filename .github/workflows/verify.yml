name: verify

# The repo's own gate is the CI. If verify.sh is what we ask other people to
# trust, running anything else here would be a different claim than the one we
# ship.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # macOS uses BSD cksum and BSD date; Linux uses GNU. The gate hashes tree
    # state with cksum and stamps the ledger with date, so both have to pass.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          else
            brew install shellcheck
          fi

      - name: Show versions
        run: |
          bash --version | head -1
          git --version
          python3 --version
          shellcheck --version | grep version:

      - name: Run the gate
        run: ./verify.sh

  # The gate has to fail when it should. A green verify.sh only proves the happy
  # path; this proves the unhappy one, in CI, on every commit.
  #
  # Every hook below runs with the sandbox as the working directory. The state
  # the hooks write is keyed by repository, and an earlier version of this job
  # ran the session hook in $GITHUB_WORKSPACE instead. The keys did not match,
  # the gate saw a session that had touched nothing, and it exited 0. The job
  # that existed to prove the gate blocks could not have passed.
  gate-blocks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: A failing verify.sh must block the turn
        run: |
          set -eu
          gate="$GITHUB_WORKSPACE/hooks/prove-it.sh"
          session="$GITHUB_WORKSPACE/hooks/session-start.sh"

          sandbox=$(mktemp -d)
          git -C "$sandbox" init -q
          git -C "$sandbox" config user.email ci@example.com
          git -C "$sandbox" config user.name ci
          echo base > "$sandbox/file.txt"
          printf '#!/bin/bash\nexit 1\n' > "$sandbox/verify.sh"
          chmod +x "$sandbox/verify.sh"
          git -C "$sandbox" add -A
          git -C "$sandbox" commit -qm init

          # The session starts here, with the gate armed and nothing to prove.
          ( cd "$sandbox" && printf '{"session_id":"ci"}' | bash "$session" )

          # Now the session changes the repository.
          echo dirty >> "$sandbox/file.txt"

          set +e
          ( cd "$sandbox" && printf '{"session_id":"ci","stop_hook_active":false,"transcript_path":""}' \
              | bash "$gate" >/dev/null 2>&1 )
          rc=$?
          set -e

          if [ "$rc" -ne 2 ]; then
            echo "::error::gate returned $rc, expected 2 (turn blocked)"
            exit 1
          fi
          echo "gate blocked the turn, as it must"

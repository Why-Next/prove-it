name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to package, for example v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: ref
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${{ github.event.inputs.tag }}"
            git rev-parse "$tag" >/dev/null
          fi
          case "$tag" in
            v*) ;;
            *) echo "tag must start with v" >&2; exit 1 ;;
          esac
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Verify before packaging
        run: ./verify.sh

      - name: Build source package
        run: |
          set -eu
          mkdir -p dist
          tag="${{ steps.ref.outputs.tag }}"
          git archive --format=tar.gz --prefix="prove-it-${tag#v}/" \
            -o "dist/prove-it-${tag}.tar.gz" "$tag"
          shasum -a 256 "dist/prove-it-${tag}.tar.gz" \
            > "dist/prove-it-${tag}.tar.gz.sha256"
          {
            printf '# prove-it %s\n\n' "$tag"
            printf 'This release was built from the annotated tag `%s`.\n\n' "$tag"
            printf 'Assets:\n'
            # printf --: a format string that starts with '-' reads as an
            # option and killed the first three release runs of this workflow.
            printf -- '- `prove-it-%s.tar.gz`\n' "$tag"
            printf -- '- `prove-it-%s.tar.gz.sha256`\n\n' "$tag"
            printf 'Verification:\n'
            printf -- '- `shasum -a 256 -c prove-it-%s.tar.gz.sha256`\n' "$tag"
            printf -- '- `gh attestation verify prove-it-%s.tar.gz -R Why-Next/prove-it`\n' "$tag"
          } > "dist/RELEASE_NOTES.md"

      - name: Attest source package
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/prove-it-${{ steps.ref.outputs.tag }}.tar.gz"

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "prove-it-${{ steps.ref.outputs.tag }}"
          path: dist/*

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ steps.ref.outputs.tag }}"
          archive="dist/prove-it-${tag}.tar.gz"
          checksum="dist/prove-it-${tag}.tar.gz.sha256"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" "$checksum" --clobber
          else
            gh release create "$tag" "$archive" "$checksum" \
              --verify-tag \
              --title "prove-it $tag" \
              --notes-file "dist/RELEASE_NOTES.md"
          fi
